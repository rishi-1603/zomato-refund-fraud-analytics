name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax check (py_compile)
        run: python -m py_compile dashboard/app.py dashboard/ai_investigator.py dashboard/kpi_engine.py dashboard/risk_rules.py dashboard/decision_engine.py

      - name: Security scan (no secrets in tracked files)
        run: |
          # Check for common secret patterns
          ! grep -r "github_pat_" . --exclude-dir=.git --exclude="*.md" || true
          ! grep -r "sk-" . --exclude-dir=.git --exclude="*.md" || true
          ! grep -r "AQ\." . --exclude-dir=.git --exclude="*.md" || true
          ! grep -r "vcp_" . --exclude-dir=.git --exclude="*.md" || true
          echo "Secret scan passed"

      - name: Validate risk score against planted ground truth
        run: python scripts/validate_risk_score.py

      - name: Run rules-vs-ML comparison
        run: python scripts/model_comparison.py

      - name: Run all tests
        run: pytest -q --tb=short

      - name: Verify key metrics match source data
        run: |
          python -c "
import pandas as pd
o = pd.read_csv('data/processed/zomato_with_refunds.csv')
o['Order_Date'] = pd.to_datetime(o['Order_Date'], dayfirst=True)
assert len(o) == 45584, f'Orders: {len(o)}'
assert o['Customer_ID'].nunique() == 9895, f'Customers: {o[\"Customer_ID\"].nunique()}'
assert int(o['Refund_Requested'].sum()) == 3596, f'Refunds: {int(o[\"Refund_Requested\"].sum())}'
assert round(o['Refund_Amount'].sum(), 2) == 974343.55, f'Amount: {round(o[\"Refund_Amount\"].sum(), 2)}'
print('All source metrics verified')
"